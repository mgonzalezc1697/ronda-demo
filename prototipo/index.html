<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ronda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Una sola estructura: barra lateral en laptop, barra inferior en teléfono.
   Dos temas (color de acento + ilustración) sobre los mismos componentes.
   Tokens derivados de las rampas neutro / secundario / acento cálido de AutomStack. */
:root{
  --font-display:'Bricolage Grotesque','Public Sans',system-ui,sans-serif;
  --font-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:12px;
  --paper-bg:#FFFFFF; --paper-ink:#18181B; --paper-line:#CACACE;
  /* neutros (claro) */
  --bg-page:#FAFAFA; --bg-surface:#FFFFFF; --bg-sunk:#F2F2F3;
  --text:#18181B; --text-2:#5C5B67; --text-3:#6A6976;
  --border:#E5E4E7; --border-strong:#CACACE;
  /* tema internista / general (claro) */
  --accent:#076B6B; --accent-hover:#084646; --accent-on:#FFFFFF; --accent-ink:#076B6B;
  --accent-soft:#EEFCFC; --accent-soft-text:#084646;
  /* semánticos */
  --ok-bg:#E3F5EA; --ok-text:#1B6B43; --ok-bar:#2E9E67;
  --warn-bg:#FFF0D6; --warn-text:#8A4B00; --warn-bar:#B97400;
  --bad-bg:#FDE7E4; --bad-text:#B42318; --bad-bar:#D64533;
  --shadow:0 12px 40px rgba(24,24,27,.18);
}
/* tema pediatría (claro) */
:root[data-tema="pediatria"]{
  --bg-page:#FDF7F6; --bg-sunk:#F7F0EE; --border:#EADFDC;
  --accent:#FF6B4A; --accent-hover:#F93E15; --accent-on:#18181B; --accent-ink:#C02D0C;
  --accent-soft:#FCEFEC; --accent-soft-text:#7C220E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-page:#18181B; --bg-surface:#2C2B31; --bg-sunk:#222126;
    --text:#FAFAFA; --text-2:#CACACE; --text-3:#A3A2A9; --border:#414149; --border-strong:#5C5B67;
    --accent:#00B8B8; --accent-hover:#22F8F8; --accent-on:#18181B; --accent-ink:#75F6F6;
    --accent-soft:#072626; --accent-soft-text:#B2F7F7;
    --ok-bg:#12301F; --ok-text:#7FE0A8; --ok-bar:#4CC38A;
    --warn-bg:#3A2A08; --warn-text:#F5C05E; --warn-bar:#F2B84B;
    --bad-bg:#3F1512; --bad-text:#FF9C92; --bad-bar:#FF7A6B;
    --shadow:0 12px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
  :root:not([data-theme="light"])[data-tema="pediatria"]{
    --accent:#FB9A84; --accent-hover:#FAC0B2; --accent-on:#18181B; --accent-ink:#FAC0B2;
    --accent-soft:#43160C; --accent-soft-text:#FBDBD4;
  }
}
:root[data-theme="dark"]{
  --bg-page:#18181B; --bg-surface:#2C2B31; --bg-sunk:#222126;
  --text:#FAFAFA; --text-2:#CACACE; --text-3:#A3A2A9; --border:#414149; --border-strong:#5C5B67;
  --accent:#00B8B8; --accent-hover:#22F8F8; --accent-on:#18181B; --accent-ink:#75F6F6;
  --accent-soft:#072626; --accent-soft-text:#B2F7F7;
  --ok-bg:#12301F; --ok-text:#7FE0A8; --ok-bar:#4CC38A;
  --warn-bg:#3A2A08; --warn-text:#F5C05E; --warn-bar:#F2B84B;
  --bad-bg:#3F1512; --bad-text:#FF9C92; --bad-bar:#FF7A6B;
  --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
:root[data-theme="dark"][data-tema="pediatria"]{
  --accent:#FB9A84; --accent-hover:#FAC0B2; --accent-on:#18181B; --accent-ink:#FAC0B2;
  --accent-soft:#43160C; --accent-soft-text:#FBDBD4;
}

*{box-sizing:border-box}
body{background:var(--bg-page);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px} h2{font-size:19px} h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* barra de demostración */
.demo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:8px 16px;background:var(--bg-sunk);border-bottom:1px solid var(--border);font-size:13px;color:var(--text-2)}
.demo b{color:var(--text)}
.tema-sw{display:inline-flex;background:var(--bg-surface);border:1px solid var(--border-strong);border-radius:999px;padding:2px}
.tema-sw label{position:relative}
.tema-sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.tema-sw span{display:block;padding:5px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--text-2)}
.tema-sw input:checked+span{background:var(--accent);color:var(--accent-on)}
.tema-sw input:focus-visible+span{outline:2px solid var(--accent-ink);outline-offset:2px}

/* estructura */
.shell{display:grid;grid-template-columns:1fr;min-height:calc(100vh - 44px)}
.side{display:none}
.main{min-width:0;padding:16px 16px 96px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg-surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;border-radius:10px;font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer}
.tab[aria-current="page"]{color:var(--accent-ink)}
.tab[aria-current="page"] svg{stroke-width:2.4}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad-bar);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
@media (min-width:900px){
  .shell{grid-template-columns:248px 1fr}
  .side{display:flex;flex-direction:column;gap:20px;position:sticky;top:0;align-self:start;height:100vh;padding:24px 16px;border-right:1px solid var(--border);background:var(--bg-surface)}
  .main{padding:32px 40px 48px}
  .tabs{display:none}
  .topbar .brand-sm{display:none}
  h1{font-size:32px}
}
.brand{display:flex;align-items:center;gap:10px}
.brand .wm{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1;letter-spacing:-.02em}
.brand .by{display:block;font-family:var(--font-body);font-weight:500;font-size:11.5px;color:var(--text-3);letter-spacing:0;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:none;font-weight:600;color:var(--text-2);cursor:pointer;text-align:left}
.nav button:hover{background:var(--bg-sunk)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-soft-text)}
.nav .badge{position:static;margin-left:auto}
.doc{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:16px;border-top:1px solid var(--border)}
.avatar{width:38px;height:38px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent-soft-text);display:grid;place-items:center;font-weight:700;font-size:14px}
.doc .n{font-weight:600;line-height:1.2}.doc .e{font-size:13px;color:var(--text-2);line-height:1.2}

/* tarjetas y controles */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r);padding:18px}
.card.flat{background:var(--bg-sunk);border-color:transparent}
.card h2{margin-bottom:12px}
.head{display:flex;flex-direction:column;gap:6px}
.head p{color:var(--text-2);max-width:60ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--border-strong);background:var(--bg-surface);font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--bg-sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.icon{padding:0;width:44px}
.btn.icon.sm{width:36px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;line-height:1.6;white-space:nowrap}
.pill.soft{background:var(--accent-soft);color:var(--accent-soft-text)}
.pill.ok{background:var(--ok-bg);color:var(--ok-text)}
.pill.warn{background:var(--warn-bg);color:var(--warn-text)}
.pill.bad{background:var(--bad-bg);color:var(--bad-text)}
.pill.neutral{background:var(--bg-sunk);color:var(--text-2)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:8px;background:var(--bg-sunk);font-size:13px;color:var(--text-2)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:13px;font-weight:600;color:var(--text-2)}
.lbl .opt{font-weight:400;color:var(--text-3)}
.in,select.in,textarea.in{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--bg-surface);font-size:16px}
textarea.in{min-height:96px;resize:vertical;line-height:1.5}
.in::placeholder{color:var(--text-3)}
.in[readonly],.in:disabled{background:var(--bg-sunk);color:var(--text-2)}
.hint{font-size:13px;color:var(--text-2)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0;margin-bottom:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.opts label{position:relative}
.opts input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.opts span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:8px 10px;border:1px solid var(--border-strong);border-radius:10px;background:var(--bg-surface);font-weight:600;font-size:14px;color:var(--text-2)}
.opts input:checked+span{border-color:var(--accent-ink);background:var(--accent-soft);color:var(--accent-soft-text);box-shadow:inset 0 0 0 1px var(--accent-ink)}
.opts input:focus-visible+span{outline:2px solid var(--accent-ink);outline-offset:2px}
.err{color:var(--bad-text);background:var(--bad-bg);padding:10px 12px;border-radius:10px;font-weight:500}

/* login */
.login{min-height:calc(100vh - 44px);display:grid;grid-template-columns:1fr;align-items:center;gap:24px;padding:24px 16px;max-width:1040px;margin:0 auto}
.login .ill{max-width:420px;width:100%;justify-self:center}
.login form{display:flex;flex-direction:column;gap:16px;max-width:400px;width:100%;justify-self:center}
.login .promise{font-size:17px;color:var(--text-2);max-width:34ch}
@media (min-width:900px){.login{grid-template-columns:1.1fr 1fr;gap:56px}.login .ill{justify-self:start}}

/* búsqueda */
.search{display:grid;grid-template-columns:96px 1fr;gap:10px}
.plist{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.pbtn{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r);text-align:left;cursor:pointer}
.pbtn:hover{border-color:var(--border-strong);background:var(--bg-sunk)}
.pbtn .who{flex:1;min-width:0}
.pbtn .who b{display:block;font-weight:600}
.pbtn .who span{font-size:13px;color:var(--text-2)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 16px}
.empty svg{width:150px;max-width:60%;height:auto}

/* ficha */
.pfile{display:flex;flex-direction:column;gap:14px}
.pfile .top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.pfile .id{display:flex;flex-direction:column;gap:4px;min-width:0}
.pfile .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--text-2);font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.grid-ficha{display:grid;grid-template-columns:1fr;gap:20px;grid-template-areas:"ant" "tl" "adj"}
.grid-ficha>*{min-width:0}
.a-ant{grid-area:ant}.a-tl{grid-area:tl}.a-adj{grid-area:adj}
@media (min-width:900px){.grid-ficha{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);grid-template-areas:"tl ant" "tl adj";align-items:start}}
.ant{display:flex;flex-direction:column;gap:12px;margin:0}
.ant div{display:flex;flex-direction:column;gap:5px}
.ant dt{font-size:13px;font-weight:600;color:var(--text-2)}
.ant dd{margin:0;display:flex;flex-wrap:wrap;gap:6px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;position:relative}
.tl li{position:relative;padding-left:26px}
.tl li::before{content:"";position:absolute;left:5px;top:22px;bottom:-20px;width:2px;background:var(--border)}
.tl li:last-child::before{display:none}
.tl li::after{content:"";position:absolute;left:0;top:14px;width:12px;height:12px;border-radius:50%;background:var(--bg-surface);border:3px solid var(--accent-ink)}
.tl article{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.tl .ln{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.tl time{font-weight:600}
.tl details summary{cursor:pointer;color:var(--accent-ink);font-weight:600;padding:4px 0}
.tl .sec{margin-top:8px;display:flex;flex-direction:column;gap:2px}
.tl .sec b{font-size:13px;color:var(--text-2)}
.tl .thumbs{display:flex;flex-wrap:wrap;gap:8px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.fig{display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0}
.fig .im{aspect-ratio:4/3;width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:#0E0E10}
.fig .im svg,.fig .im img{display:block;width:100%;height:100%;object-fit:cover}
.fig span{font-size:13px;line-height:1.3;color:var(--text-2)}
.thumb{width:56px;height:42px;border-radius:8px;overflow:hidden;border:1px solid var(--border);padding:0;background:#0E0E10;cursor:pointer}
.thumb svg,.thumb img{display:block;width:100%;height:100%;object-fit:cover}

/* registrar */
.reg{display:grid;grid-template-columns:1fr;gap:20px;align-items:start}
.reg>*{min-width:0}
.reg .col{display:flex;flex-direction:column;gap:20px}
@media (min-width:900px){.reg{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr)}.reg aside{position:sticky;top:24px}}
.calc{display:flex;flex-direction:column;gap:14px}
.calc .l{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.calc .big{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-.02em}
.calc hr{border:0;border-top:1px solid var(--border);margin:0;width:100%}
.sec-edit{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg-page)}
.sec-edit .h{display:flex;gap:8px;align-items:center}
.up{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.up .prev{position:relative}
.up .prev .thumb{width:72px;height:56px}
.up .prev button.x{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:1px solid var(--border-strong);background:var(--bg-surface);display:grid;place-items:center;cursor:pointer;padding:0}

/* resumen */
.mnav{display:flex;align-items:center;gap:8px}
.mnav .cur{font-family:var(--font-display);font-weight:700;font-size:20px;min-width:9.5ch;text-align:center;text-transform:capitalize}
.ledger{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.ledger>div{padding:0 14px;border-left:1px solid var(--border);min-width:0}
.ledger>div:first-child{padding-left:0;border-left:0}
.ledger .v{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.ledger .k{font-size:13px;color:var(--text-2)}
@media (min-width:640px){.ledger .v{font-size:30px}}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--bg-sunk);border:1px solid var(--border)}
.bar i{display:block;height:100%}
.bar .c{background:var(--ok-bar)}.bar .p{background:var(--warn-bar)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--text-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.cent{display:flex;flex-direction:column;gap:12px}
.cent .rowc{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.cent .rowc .k{font-size:12.5px;color:var(--text-2)}
.cent .rowc .v{font-weight:700;font-size:16px}
.cent .nm{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;justify-content:space-between}
.cent .nm b{font-family:var(--font-display);font-size:17px}
@media (min-width:900px){
  .cent{display:grid;grid-template-columns:minmax(200px,1.4fr) minmax(0,2fr) minmax(140px,1fr);align-items:center;gap:16px}
  .cent .bar{grid-column:auto}
}
.cent .barw{display:flex;flex-direction:column;gap:6px}
.detail summary{cursor:pointer;color:var(--accent-ink);font-weight:600;padding:4px 0}
.dl{width:100%;border-collapse:collapse;font-size:14px}
.dl th{font-weight:600;color:var(--text-2);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);font-size:13px}
.dl td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
.dl td.r,.dl th.r{text-align:right}
.tw{overflow-x:auto}

/* alertas */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.fchip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border-strong);background:var(--bg-surface);font-weight:600;font-size:14px;color:var(--text-2);cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-ink);color:var(--accent-soft-text)}
.al{display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.al li{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.al .t{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 12px;align-items:flex-start}
.al .t b{font-size:16px;font-weight:600}
.al .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.al .nums .k{font-size:12.5px;color:var(--text-2)}
.al .nums .v{font-weight:700}
.payform{border-top:1px dashed var(--border-strong);padding-top:14px;display:flex;flex-direction:column;gap:14px}
.sum-strip{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center}

/* migración de historias */
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:24px 16px;border:2px dashed var(--border-strong);border-radius:var(--r);background:var(--bg-page);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent-ink);background:var(--accent-soft)}

const D=()=>DB[S.theme];
const centro=id=>D().centros.find(c=>c.id===id);
const paciente=id=>D().pacientes.find(p=>p.id===id);
const payUsd=m=>{const r=parseFloat(m.rec)||0;if(m.cur==='Bs'){const t=parseFloat(m.tasa)||0;return t?r/t:0}return r};
const corresponde=c=>r2(c.ref*c.pct/100);
const cobrado=c=>r2(c.pagos.reduce((s,p)=>s+payUsd(p),0));
const pendiente=c=>Math.max(0,r2(corresponde(c)-cobrado(c)));
const estado=c=>pendiente(c)<0.01?'cobrado':(cobrado(c)>0?'parcial':'pendiente');
const pendientes=()=>D().consultas.filter(c=>pendiente(c)>=0.01).sort((a,b)=>a.d<b.d?-1:1);
const months=()=>[...new Set(D().consultas.map(c=>c.d.slice(0,7)))].sort();
const lastVisit=p=>D().consultas.filter(c=>c.pid===p.id).map(c=>c.d).sort().pop();
const fsz=b=>b>=1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(b/1024))+' KB';
const dtype=n=>/\.pdf$/i.test(n)?'PDF':'Word';
const docRow=(x,full)=>`<li><span class="fi" aria-hidden="true">${ic('file',20)}</span><div class="tx"><b>${esc(x.name).replace(/_/g,'_<wbr>')}</b><span class="m num"><span class="pill neutral">${dtype(x.name)}</span><span>${fsz(x.b)}</span><span>Subido ${fdate(x.d)}</span></span>${full?`<span class="m"><span class="pill ok">${ic('check',12)}Vinculado a ${esc((paciente(x.pid)||{n:'paciente'}).n)}</span></span>`:''}</div><div class="fa"><button class="btn sm" data-act="verdoc" data-id="${x.id}">Ver</button><button class="btn sm" data-act="deldoc" data-id="${x.id}" aria-label="Quitar ${esc(x.name)}">Quitar</button></div></li>`;
const statePill=c=>{const e=estado(c);return e==='cobrado'?'<span class="pill ok">Cobrado</span>':e==='parcial'?'<span class="pill warn">Cobro parcial</span>':'<span class="pill bad">Sin cobrar</span>'};

function mountMigrar(){
  const file=$('#m-file'),drop=$('#m-drop'),err=$('#m-err'),sel=$('#m-pid');
  if(S.migErr){err.textContent=S.migErr;err.hidden=false;S.migErr=''}
  sel.onchange=()=>S.migPid=sel.value;
  const add=fs=>{
    const ok=[],bad=[];
    [...fs].forEach(f=>{
      if(!/\.(docx?|pdf)$/i.test(f.name))bad.push(f.name+': solo se aceptan archivos Word (.doc, .docx) o PDF.');
      else if(f.size>20*1048576)bad.push(f.name+': pesa más de 20 MB.');
      else ok.push(f);
    });
    S.migPid=sel.value;
    ok.forEach(f=>D().docs.push({id:'d'+Date.now()+Math.random().toString(36).slice(2,6),name:f.name,b:f.size,pid:sel.value,d:TODAY}));
    S.migErr=bad.join(' ');
    render();
    if(ok.length)toast(ok.length===1?'Archivo subido a la historia de '+paciente(sel.value).n:ok.length+' archivos subidos a la historia de '+paciente(sel.value).n);
  };
  file.onchange=()=>{if(file.files.length)add(file.files)};
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
  drop.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files.length)add(e.dataTransfer.files)});
}

function payHTML(id,m){
  const opts=[['pm','Pago móvil (Bs)'],['usd','Divisa en efectivo'],['tr','Transferencia'],['otro','Otro']];
  const cs=m.m==='tr'||m.m==='otro';
  return `<fieldset><legend class="lbl">Método de pago</legend><div class="opts">${opts.map(([v,l])=>`<label><input type="radio" name="${id}-m" value="${v}" ${m.m===v?'checked':''}><span>${l}</span></label>`).join('')}</div></fieldset>
  <div class="row2">
    ${cs?`<div class="field"><label class="lbl" for="${id}-cur">Moneda</label><select class="in" id="${id}-cur"><option value="Bs" ${m.cur==='Bs'?'selected':''}>Bolívares</option><option value="USD" ${m.cur==='USD'?'selected':''}>Dólares</option></select></div>`:''}
    <div class="field"><label class="lbl" for="${id}-rec">Monto recibido (${m.cur==='Bs'?'Bs':'USD'})</label><input class="in num" id="${id}-rec" type="number" step="0.01" min="0" inputmode="decimal" value="${esc(m.rec)}"></div>
    ${m.cur==='Bs'?`<div class="field"><label class="lbl" for="${id}-tasa">Tasa BCV del día</label><input class="in num" id="${id}-tasa" type="number" step="0.01" min="0" inputmode="decimal" value="${esc(m.tasa)}"></div>`:''}
  </div>
  <p class="hint" id="${id}-eq"></p>`;
}
function mountPay(id,m,getExp,onChange){
  const box=$('#'+id+'-box');box.innerHTML=payHTML(id,m);
  const suggest=()=>{if(m.touched)return;const e=getExp(),t=parseFloat(m.tasa)||0;m.rec=m.cur==='Bs'?(t?String(r2(e*t)):''):String(r2(e))};
  const eq=()=>{const q=$('#'+id+'-eq');if(!q)return;q.textContent=m.cur==='Bs'?`Equivale a ${usd(payUsd(m))} a Bs ${nf.format(parseFloat(m.tasa)||0)} por dólar. Tasa de ejemplo del prototipo.`:'Se registra directamente en dólares.'};
  if(!m.rec&&!m.touched)suggest();
  box.innerHTML=payHTML(id,m);eq();
  $$(`input[name="${id}-m"]`,box).forEach(r=>r.onchange=()=>{m.m=r.value;m.cur=r.value==='pm'?'Bs':r.value==='usd'?'USD':r.value==='tr'?'Bs':'USD';m.touched=false;m.rec='';mountPay(id,m,getExp,onChange);onChange&&onChange()});
  const cur=$('#'+id+'-cur',box);if(cur)cur.onchange=()=>{m.cur=cur.value;m.touched=false;m.rec='';mountPay(id,m,getExp,onChange);onChange&&onChange()};
  $('#'+id+'-rec',box).oninput=e=>{m.rec=e.target.value;m.touched=true;eq();onChange&&onChange()};
  const ts=$('#'+id+'-tasa',box);if(ts)ts.oninput=e=>{m.tasa=e.target.value;if(!m.touched){suggest();$('#'+id+'-rec').value=m.rec}eq();onChange&&onChange()};
  m.refresh=()=>{if(!m.touched){suggest();const r=$('#'+id+'-rec');if(r)r.value=m.rec}eq()};
}

/* 4. registrar consulta */
function newReg(pid){return {pid:pid||D().pacientes[0].id,fecha:TODAY,centro:'',ref:D().fee,pct:100,noCobrado:false,pay:newPay(),tipo:'informe',motivo:'',secs:[{t:'Enfermedad actual',x:''},{t:'Examen físico',x:''},{t:'Impresión y plan',x:''}],nota:'',adj:[],err:''}}
function regNums(){const R=S.reg;const pct=R.centro?(parseFloat(R.pct)||0):100;const ref=parseFloat(R.ref)||0;const cor=r2(ref*pct/100);const cob=R.noCobrado?0:r2(payUsd(R.pay));const pen=Math.max(0,r2(cor-cob));return {pct,ref,cor,cob,pen}}
function viewRegistrar(){
  const R=S.reg,d=D();
  return `<div class="head"><h1>Registrar consulta</h1><p>Consulta, cobro y evolución en una sola pantalla.</p></div>
  <div class="reg">
   <div class="col">
    <section class="card stack"><h2>Consulta</h2>
      <div class="row2">
        <div class="field"><label class="lbl" for="r-pid">Paciente</label><select class="in" id="r-pid">${d.pacientes.map(p=>`<option value="${p.id}" ${p.id===R.pid?'selected':''}>${esc(p.n)} · ${p.ced}</option>`).join('')}</select></div>
        <div class="field"><label class="lbl" for="r-fecha">Fecha</label><input class="in" id="r-fecha" type="date" max="${TODAY}" value="${R.fecha}"></div>
      </div>
      <div class="row2">
        <div class="field"><label class="lbl" for="r-centro">Centro médico <span class="opt">(opcional)</span></label><select class="in" id="r-centro"><option value="">Sin centro (consulta particular)</option>${d.centros.map(c=>`<option value="${c.id}" ${c.id===R.centro?'selected':''}>${esc(c.n)}</option>`).join('')}</select></div>
        <div class="field"><label class="lbl" for="r-ref">Monto de referencia (USD)</label><input class="in num" id="r-ref" type="number" step="0.01" min="0" inputmode="decimal" value="${R.ref}"></div>
      </div>
      <div class="field" id="r-pctbox"></div>
    </section>
    <section class="card stack"><h2>Cobro</h2>
      <label style="display:flex;gap:10px;align-items:center;min-height:32px"><input type="checkbox" id="r-nocob" ${R.noCobrado?'checked':''} style="width:20px;height:20px;accent-color:var(--accent-ink)"><span>Aún no he cobrado esta consulta</span></label>
      <div class="stack" id="r-pay-wrap"><div class="stack" id="r-pay-box"></div></div>
    </section>
    <section class="card stack"><h2>Evolución</h2>
      <fieldset><legend class="lbl">Tipo de registro</legend><div class="opts"><label><input type="radio" name="r-tipo" value="informe" ${R.tipo==='informe'?'checked':''}><span>Informe completo</span></label><label><input type="radio" name="r-tipo" value="nota" ${R.tipo==='nota'?'checked':''}><span>Nota de control</span></label></div></fieldset>
      <div class="field"><label class="lbl" for="r-motivo">Motivo de consulta</label><input class="in" id="r-motivo" value="${esc(R.motivo)}" placeholder="${S.theme==='pediatria'?'Ej. Fiebre de dos días':'Ej. Visión borrosa en ojo derecho'}"></div>
      <div class="stack" id="r-evo"></div>
    </section>
    <section class="card stack"><h2>Adjuntos</h2>
      <p class="hint">Fotos de estudios: fondo de ojo, OCT, resonancias, radiografías.</p>
      <div class="up" id="r-up"></div>
    </section>
   </div>
   <aside class="card calc" aria-label="Resumen de la consulta"><h2 style="margin:0">Resumen</h2><div id="r-sum"></div>
     <div class="err" id="r-err" role="alert" hidden></div>
     <button class="btn primary" data-act="guardar">Guardar consulta</button>
   </aside>
  </div>`;
}
function mountRegistrar(){
  const R=S.reg;
  const getExp=()=>regNums().cor;
  const sum=()=>{const n=regNums();const e=R.noCobrado?'pendiente':(n.pen<0.01?'cobrado':(n.cob>0?'parcial':'pendiente'));
    $('#r-sum').innerHTML=`<div class="stack" style="gap:14px"><div class="l"><span class="muted">Te corresponde</span><span class="big num">${usd(n.cor)}</span></div><p class="hint num">${n.pct}% de ${usd(n.ref)}${R.centro?'':' · sin centro, cobras el 100%'}</p><hr><div class="l"><span class="muted">Recibido</span><b class="num">${usd(n.cob)}</b></div><div class="l"><span class="muted">Queda pendiente</span><b class="num">${usd(n.pen)}</b></div><div>${e==='cobrado'?'<span class="pill ok">Cobrado completo</span>':e==='parcial'?'<span class="pill warn">Cobro parcial</span>':'<span class="pill bad">Pendiente de cobro</span>'}</div></div>`};
  const pctBox=()=>{const b=$('#r-pctbox'),c=R.centro?centro(R.centro):null;
    b.innerHTML=c?`<label class="lbl" for="r-pct">Tu porcentaje en este centro (%)</label><input class="in num" id="r-pct" type="number" min="0" max="100" step="1" inputmode="numeric" value="${R.pct}"><p class="hint">Sugerido por el acuerdo con ${esc(c.n)}: ${c.pct}%. Puedes ajustarlo para esta consulta.</p>`:`<span class="lbl">Tu porcentaje</span><input class="in num" value="100 % (automático)" readonly aria-label="Porcentaje automático 100%"><p class="hint">Sin centro no hay reparto: cobras todo.</p>`;
    const i=$('#r-pct');if(i)i.oninput=e=>{R.pct=e.target.value;R.pay.refresh&&R.pay.refresh();sum()}};
  const after=()=>{R.pay.refresh&&R.pay.refresh();sum()};
  $('#r-pid').onchange=e=>R.pid=e.target.value;
  $('#r-fecha').onchange=e=>R.fecha=e.target.value;
  $('#r-centro').onchange=e=>{R.centro=e.target.value;R.pct=R.centro?centro(R.centro).pct:100;pctBox();after()};
  $('#r-ref').oninput=e=>{R.ref=e.target.value;after()};
  $('#r-nocob').onchange=e=>{R.noCobrado=e.target.checked;$('#r-pay-wrap').hidden=R.noCobrado;sum()};
  $('#r-pay-wrap').hidden=R.noCobrado;
  $('#r-motivo').oninput=e=>R.motivo=e.target.value;
  $$('input[name="r-tipo"]').forEach(r=>r.onchange=()=>{R.tipo=r.value;evo()});
  R.pay.touched=false;R.pay.rec='';
  mountPay('r-pay',R.pay,getExp,sum);
  pctBox();sum();evo();ups();
  function evo(){
    const b=$('#r-evo');
    if(R.tipo==='nota'){b.innerHTML=`<div class="field"><label class="lbl" for="r-nota">Nota</label><textarea class="in" id="r-nota" placeholder="Cómo sigue el paciente, ajustes de tratamiento, indicaciones">${esc(R.nota)}</textarea></div>`;$('#r-nota').oninput=e=>R.nota=e.target.value;return}
    b.innerHTML=`<p class="hint">Las secciones cambian según el motivo de consulta. Renómbralas, quítalas o agrega otras.</p>${R.secs.map((s,i)=>`<div class="sec-edit"><div class="h"><input class="in" data-si="${i}" data-f="t" aria-label="Título de la sección ${i+1}" value="${esc(s.t)}" style="font-weight:600"><button class="btn icon sm" data-act="delsec" data-i="${i}" aria-label="Quitar sección ${esc(s.t)}">${ic('x',16)}</button></div><textarea class="in" data-si="${i}" data-f="x" aria-label="Contenido de ${esc(s.t)}" placeholder="Escribe aquí">${esc(s.x)}</textarea></div>`).join('')}<div><button class="btn sm" data-act="addsec">${ic('plus',16)}Agregar sección</button></div>`;
    $$('[data-si]',b).forEach(el=>el.oninput=e=>{R.secs[+el.dataset.si][el.dataset.f]=e.target.value});
  }
  function ups(){
    const u=$('#r-up');
    u.innerHTML=R.adj.map((a,i)=>`<div class="prev"><span class="thumb"><img src="${a.src}" alt="${esc(a.label)}"></span><button class="x" data-act="deladj" data-i="${i}" aria-label="Quitar ${esc(a.label)}">${ic('x',14)}</button></div>`).join('')+`<label class="btn sm" for="r-file" style="cursor:pointer">${ic('image',16)}Adjuntar fotos</label><input id="r-file" class="sr" type="file" accept="image/*" multiple>`;
    $('#r-file').onchange=e=>{[...e.target.files].forEach(f=>{const fr=new FileReader();fr.onload=()=>{R.adj.push({k:'foto',label:f.name.replace(/\.[^.]+$/,'')||'Foto adjunta',src:fr.result});ups()};fr.readAsDataURL(f)})};
  }
  S._evo=evo;S._ups=ups;S._sum=sum;
}
function guardar(){
  const R=S.reg,n=regNums(),err=$('#r-err');
  const fail=m=>{err.textContent=m;err.hidden=false;err.scrollIntoView({block:'nearest'})};
  if(!R.pid)return fail('Elige el paciente.');
  if(!R.motivo.trim())return fail('Escribe el motivo de consulta para guardar la evolución.');
  if(!(n.ref>0))return fail('El monto de referencia debe ser mayor a cero.');
  if(R.centro&&(n.pct<0||n.pct>100))return fail('El porcentaje debe estar entre 0 y 100.');
  if(!R.noCobrado&&R.pay.cur==='Bs'&&!(parseFloat(R.pay.tasa)>0))return fail('Indica la tasa BCV del día para convertir los bolívares.');
  const evo=R.tipo==='informe'?{t:'informe',motivo:R.motivo.trim(),s:R.secs.filter(s=>s.x.trim()).map(s=>[s.t.trim()||'Sección',s.x.trim()]),adj:R.adj}:{t:'nota',motivo:R.motivo.trim(),txt:R.nota.trim()||'Sin comentarios.',adj:R.adj};
  if(evo.t==='informe'&&!evo.s.length)return fail('Escribe el contenido de al menos una sección del informe.');
  const pagos=(!R.noCobrado&&parseFloat(R.pay.rec)>0)?[P(R.pay.m,parseFloat(R.pay.rec),R.pay.cur,R.pay.cur==='Bs'?parseFloat(R.pay.tasa):undefined)]:[];
  D().consultas.push({id:'n'+Date.now(),pid:R.pid,d:R.fecha,c:R.centro||null,ref:n.ref,pct:n.pct,pagos,evo});
  const pid=R.pid;S.reg=null;S.pid=pid;S.month=months().slice(-1)[0];
  go('ficha');toast('Consulta guardada en la historia del paciente');
}

/* 5. resumen mensual */
function viewResumen(){
  const ms=months(),m=S.month||ms[ms.length-1],i=ms.indexOf(m);
  const cons=D().consultas.filter(c=>c.d.slice(0,7)===m);
  const groups=[...D().centros.map(c=>({id:c.id,n:c.n,pct:c.pct,list:cons.filter(x=>x.c===c.id)})),{id:'none',n:'Consultas particulares',pct:100,list:cons.filter(x=>!x.c)}].filter(g=>g.list.length);
  const tot=l=>({cor:r2(l.reduce((s,c)=>s+corresponde(c),0)),cob:r2(l.reduce((s,c)=>s+Math.min(cobrado(c),corresponde(c)),0)),pen:r2(l.reduce((s,c)=>s+pendiente(c),0))});
  const T=tot(cons);
  const barH=t=>`<div class="bar" role="img" aria-label="Cobrado ${usd(t.cob)} de ${usd(t.cor)}; pendiente ${usd(t.pen)}"><i class="c" style="width:${t.cor?t.cob/t.cor*100:0}%"></i><i class="p" style="width:${t.cor?t.pen/t.cor*100:0}%"></i></div>`;
  return `<div class="head"><h1>Ingresos</h1><p>Lo que te correspondía, lo que ya cobraste y lo que falta, centro por centro.</p></div>
  <div class="mnav"><button class="btn icon sm" data-act="month" data-d="-1" aria-label="Mes anterior" ${i<=0?'disabled':''}>${ic('left',18)}</button><span class="cur">${mlabel(m)}</span><button class="btn icon sm" data-act="month" data-d="1" aria-label="Mes siguiente" ${i>=ms.length-1?'disabled':''}>${ic('right',18)}</button></div>
  <section class="card stack" style="gap:16px" aria-label="Total del mes">
    <div class="ledger"><div><div class="v num">${usd(T.cor)}</div><div class="k">Te correspondía</div></div><div><div class="v num">${usd(T.cob)}</div><div class="k">Cobrado</div></div><div><div class="v num">${usd(T.pen)}</div><div class="k">Pendiente</div></div></div>
    ${barH(T)}
    <div class="legend"><span><i style="background:var(--ok-bar)"></i>Cobrado</span><span><i style="background:var(--warn-bar)"></i>Pendiente</span><span>${cons.length} consultas en el mes</span></div>
  </section>
  <section class="stack" style="gap:14px"><h2>Por centro</h2>
   ${groups.map(g=>{const t=tot(g.list);return `<article class="card stack" style="gap:14px">
     <div class="cent">
       <div class="nm"><b>${esc(g.n)}</b><span class="pill neutral">${g.id==='none'?'100% para ti':'Acuerdo '+g.pct+'%'}</span></div>
       <div class="rowc"><div><div class="k">Te correspondía</div><div class="v num">${usd(t.cor)}</div></div><div><div class="k">Cobrado</div><div class="v num">${usd(t.cob)}</div></div><div><div class="k">Pendiente</div><div class="v num" ${t.pen>=.01?'style="color:var(--warn-text)"':''}>${usd(t.pen)}</div></div></div>
       <div class="barw">${barH(t)}${t.pen>=.01?`<button class="linkbtn" style="text-align:left;justify-self:start" data-act="verpend" data-c="${g.id}">Ver pendientes de este centro</button>`:'<span class="pill ok" style="justify-self:start">Al día</span>'}</div>
     </div>
     <details class="detail"><summary>Detalle de ${g.list.length} consulta${g.list.length>1?'s':''}</summary><div class="tw"><table class="dl"><thead><tr><th>Fecha</th><th>Paciente</th><th class="r">Corresponde</th><th class="r">Cobrado</th><th>Estado</th></tr></thead><tbody>${g.list.sort((a,b)=>a.d<b.d?1:-1).map(c=>`<tr><td class="num">${fdate(c.d)}</td><td>${esc(paciente(c.pid).n)}</td><td class="r num">${usd(corresponde(c))}</td><td class="r num">${usd(cobrado(c))}</td><td>${statePill(c)}</td></tr>`).join('')}</tbody></table></div></details>
   </article>`}).join('')}
  </section>`;
}

/* 6. alertas de cobro */
function viewAlertas(){
  const all=pendientes();
  const list=all.filter(c=>S.fc==='all'||(S.fc==='none'?!c.c:c.c===S.fc));
  const tot=r2(list.reduce((s,c)=>s+pendiente(c),0));
  const opts=[['all','Todos'],...D().centros.map(c=>[c.id,c.n]),['none','Particular']];
  return `<div class="head"><h1>Por cobrar</h1><p>Consultas atendidas que todavía no cobraste completas.</p></div>
  <div class="filters" role="group" aria-label="Filtrar por centro">${opts.map(([v,l])=>`<button class="fchip" data-act="fc" data-v="${v}" aria-pressed="${S.fc===v}">${esc(l)}</button>`).join('')}</div>
  ${list.length?`<div class="sum-strip"><span class="pill warn">${ic('clock',14)}${list.length} consulta${list.length>1?'s':''} sin cobrar</span><b class="num" style="font-size:18px">${usd(tot)}</b><span class="muted">por cobrar</span></div>
  <ul class="al">${list.map(c=>{const dd=daysAgo(c.d),p=paciente(c.pid),cen=c.c?centro(c.c):null,open=S.pay&&S.pay.id===c.id;
    const sev=dd>=30?`<span class="pill bad">Más de 30 días</span>`:dd>=15?`<span class="pill warn">${dd} días</span>`:`<span class="pill neutral">${dd===0?'Hoy':dd===1?'Hace 1 día':'Hace '+dd+' días'}</span>`;
    return `<li><div class="t"><div><b>${esc(p.n)}</b><div class="muted num" style="font-size:14px">${fdate(c.d)} · ${cen?esc(cen.n):'Particular'}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap">${estado(c)==='parcial'?'<span class="pill warn">Cobro parcial</span>':''}${sev}</div></div>
     <div class="nums"><div><div class="k">Te corresponde</div><div class="v num">${usd(corresponde(c))}</div></div><div><div class="k">Recibido</div><div class="v num">${usd(cobrado(c))}</div></div><div><div class="k">Falta</div><div class="v num" style="color:var(--warn-text)">${usd(pendiente(c))}</div></div></div>
     ${open?`<div class="payform"><div class="stack" id="p-box"></div><div class="err" id="p-err" role="alert" hidden></div><div class="acts"><button class="btn primary" data-act="savepay" data-id="${c.id}">Guardar cobro</button><button class="btn" data-act="cancelpay">Cancelar</button></div></div>`
     :`<div class="acts"><button class="btn sm primary" data-act="topay" data-id="${c.id}">Registrar cobro</button><button class="btn sm" data-act="ficha" data-pid="${p.id}">Abrir ficha</button></div>`}</li>`}).join('')}</ul>`
  :`<div class="card empty">${ill('ok')}<h2>Todo cobrado${S.fc==='all'?'':' en este filtro'}</h2><p class="muted">No hay consultas pendientes. Cuando registres una consulta sin cobrar, aparecerá aquí.</p>${S.fc!=='all'?'<button class="btn sm" data-act="fc" data-v="all">Ver todos los centros</button>':''}</div>`}`;
}
function mountAlertas(){
  if(!S.pay)return;
  const c=D().consultas.find(x=>x.id===S.pay.id);
  mountPay('p',S.pay.m,()=>pendiente(c),null);
}

/* ---------- navegación y render ---------- */
function go(r){S.route=r;if(r==='registrar'&&!S.reg)S.reg=newReg(S.pid);if(r!=='alertas')S.pay=null;render();window.scrollTo(0,0)}
function render(){
  const app=$('#app');
  if(S.route==='login'){app.innerHTML=viewLogin();$('#f-login').onsubmit=e=>{e.preventDefault();go('buscar')};return}
  if(S.route==='ficha'&&!S.pid)S.route='buscar';
  const v={buscar:viewBuscar,ficha:viewFicha,migrar:viewMigrar,registrar:viewRegistrar,resumen:viewResumen,alertas:viewAlertas}[S.route]();
  app.innerHTML=shell(v);
  if(S.route==='buscar'){$('#s-ced').oninput=searchList;$('#s-pre').onchange=searchList;$('#s-ced').onkeydown=e=>{if(e.key==='Enter'){const b=$('#s-list .pbtn');if(b)b.click()}};searchList()}
  if(S.route==='registrar')mountRegistrar();
  if(S.route==='migrar')mountMigrar();
  if(S.route==='alertas')mountAlertas();
}
function setTema(t){
  S.theme=t;document.documentElement.dataset.tema=t;
  S.pid=null;S.reg=null;S.pay=null;S.migPid=null;S.migErr='';S.fc='all';S.month=months().slice(-1)[0];
  if(S.route!=='login')S.route='buscar';

}
function toast(m){const r=$('#toast-root');r.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',3200)}

/* modales */
let lastFocus=null;

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#overlay-root').children.length)closeModal()});
const closeBtn=`<button class="btn icon sm" data-act="close" aria-label="Cerrar">${ic('x',18)}</button>`;

    <div><b>${esc(p.n)}</b> · <span class="num">${p.ced}</span> · ${p.edad}</div>

   <div class="acts"><button class="btn primary" data-act="fakeprint">${ic('printer',18)}Imprimir o guardar PDF</button></div>

/* eventos */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(a==='closebg'){if(e.target===t)closeModal();return}
  switch(a){
   case 'go':go(t.dataset.to);break;
   case 'logout':S.route='login';S.pid=null;S.reg=null;render();break;
   case 'ficha':S.pid=t.dataset.pid;go('ficha');break;
   case 'nueva':S.pid=t.dataset.pid;S.reg=newReg(t.dataset.pid);go('registrar');break;
   case 'migrar':S.migFrom=t.dataset.from;S.migPid=null;S.migErr='';go('migrar');break;
   case 'verdoc':toast('En la versión final, el documento se abre aquí');break;
   case 'deldoc':{const ds=D().docs,i=ds.findIndex(x=>x.id===t.dataset.id);if(i>-1){const n=ds[i].name;ds.splice(i,1);render();toast('Archivo quitado: '+n)}break}
   case 'informe':showInforme(t.dataset.id);break;
   case 'img':showImg(t.dataset.id,+t.dataset.i);break;
   case 'close':closeModal();break;
   case 'fakeprint':toast('Disponible en la versión final: aquí se abrirá la impresión');break;
   case 'addsec':S.reg.secs.push({t:'Nueva sección',x:''});S._evo();break;
   case 'delsec':S.reg.secs.splice(+t.dataset.i,1);S._evo();break;
   case 'deladj':S.reg.adj.splice(+t.dataset.i,1);S._ups();break;
   case 'guardar':guardar();break;
   case 'month':{const ms=months(),i=ms.indexOf(S.month||ms[ms.length-1])+ +t.dataset.d;if(ms[i]){S.month=ms[i];render()}break}
   case 'verpend':S.fc=t.dataset.c;go('alertas');break;
   case 'fc':S.fc=t.dataset.v;S.pay=null;render();break;
   case 'topay':{const c=D().consultas.find(x=>x.id===t.dataset.id);S.pay={id:c.id,m:newPay()};render();break}
   case 'cancelpay':S.pay=null;render();break;
   case 'savepay':{
     const c=D().consultas.find(x=>x.id===t.dataset.id),m=S.pay.m,err=$('#p-err');
     if(!(parseFloat(m.rec)>0)){err.textContent='Indica el monto que recibiste.';err.hidden=false;break}
     if(m.cur==='Bs'&&!(parseFloat(m.tasa)>0)){err.textContent='Indica la tasa BCV del día.';err.hidden=false;break}
     c.pagos.push(P(m.m,parseFloat(m.rec),m.cur,m.cur==='Bs'?parseFloat(m.tasa):undefined));
     S.pay=null;render();toast(pendiente(c)<.01?'Cobro registrado. Consulta al día':'Cobro parcial registrado. Aún falta '+usd(pendiente(c)));break}
  }
});
$$('input[name="tema"]').forEach(r=>r.onchange=()=>setTema(r.value));
S.month=months().slice(-1)[0];
document.documentElement.dataset.tema='internista';
render();
</script>
